# fail2ban filter: wrong passwords on studio.velra.tech.
# Install: sudo cp deploy/fail2ban/reel-studio-auth.conf /etc/fail2ban/filter.d/
#
# Only real failures count: a wrong password, or a username that doesn't exist.
# The stock nginx-http-auth filter also matches "no user/password was provided",
# which nginx logs for the first, credential-less request of every visit, and
# would lock the owner out after a few page loads.
#
# nginx error log lines this matches (fail2ban strips the timestamp first):
#   [error] 812#812: *41 user "admin": password mismatch, client: 203.0.113.9, server: studio.velra.tech, ...
#   [error] 812#812: *42 user "root" was not found in "/etc/nginx/reel-studio.htpasswd", client: 203.0.113.9, server: studio.velra.tech, ...

[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ user "[^"]*"(?::? password mismatch| was not found in "[^"]*"), client: <HOST>, server: studio\.velra\.tech
ignoreregex =
datepattern = {^LN-BEG}%%Y/%%m/%%d %%H:%%M:%%S
