# fail2ban filter: wrong passwords on studio.velra.tech.
# Install: sudo cp deploy/fail2ban/reel-studio-auth.conf /etc/fail2ban/filter.d/
#
# The API logs every failed sign-in to the journal of reel-studio-api.service:
#   [Nest] 812  - 10/20/2026, 7:10:30 AM    WARN [Auth] AUTH-FAIL ip=203.0.113.9 user="admin"
# Only failed sign-ins produce that line, so opening the sign-in page never counts.

[Definition]
failregex = AUTH-FAIL ip=<HOST> user=
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=reel-studio-api.service
