# studio.velra.tech: Reel Studio, private, behind a password.
#
# Everything sits behind HTTP basic auth (one user, set up in docs/hosting.md)
# except the two paths Meta itself calls, which check their own signatures:
#   /api/instagram/webhook   X-Hub-Signature-256 (HMAC with the Instagram app secret)
#   /api/instagram/media/    signed links that expire after 3 hours
#
# The web app (Next) is on 127.0.0.1:3100 and the API (Nest) on 127.0.0.1:4100;
# velra.tech's own app keeps 127.0.0.1:3000. Install steps: docs/hosting.md.
#
# `http2 on;` needs nginx >= 1.25.1, as in velra.tech.conf.
#
# Password guessing is stopped in two layers:
#   1. Here: every address is held to a request rate the app never reaches in
#      normal use, so guesses can only arrive slowly.
#   2. fail2ban (deploy/fail2ban/reel-studio.local) reads this site's error log
#      and blocks an address at the firewall after 5 wrong passwords in 10
#      minutes, for 10 minutes the first time, doubling on every repeat
#      offence, up to a week.

# One shared state per client address. Zones must be declared at http level;
# files in sites-enabled are included there, so declaring them here works.
# 10 MB holds about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=reelstudio:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=reelstudio_meta:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name studio.velra.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://studio.velra.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.velra.tech;

    ssl_certificate     /etc/letsencrypt/live/studio.velra.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.velra.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    auth_basic           "Reel Studio";
    auth_basic_user_file /etc/nginx/reel-studio.htpasswd;

    # A page load fires a burst of API and image requests; 120 covers that
    # without a delay, and anything beyond 10/s sustained gets 429.
    limit_req        zone=reelstudio burst=120 nodelay;
    limit_req_status 429;

    # Product photos, Higgsfield videos and music go up through the API.
    client_max_body_size 1g;

    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag              "noindex, nofollow"                always;

    # ── Public: Meta calls these ─────────────────────────────────────────────
    location = /api/instagram/webhook {
        auth_basic off;
        # Meta delivers in bursts; looser, but still capped.
        limit_req zone=reelstudio_meta burst=200 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/instagram/media/ {
        auth_basic off;
        limit_req zone=reelstudio_meta burst=50 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── The API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job progress is a Server-Sent Events stream: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;

        # Uploads stream straight to the API instead of filling nginx's temp dir.
        proxy_request_buffering off;
    }

    # ── The web app ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/reel-studio.access.log;
    error_log  /var/log/nginx/reel-studio.error.log;
}
