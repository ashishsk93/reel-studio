# studio.velra.tech: Reel Studio, private, behind a sign-in page.
#
# Every request is checked against the session cookie first (auth_request →
# GET /api/auth/check). Without a session, pages redirect to /login and API
# calls get 401. Open without a session:
#   /login, /_next/, /favicon.ico   the sign-in page and the code it loads (no data)
#   /api/auth/                      sign in, sign out, status
#   /api/instagram/webhook          Meta; X-Hub-Signature-256 (HMAC with the Instagram app secret)
#   /api/instagram/media/           Meta; signed links that expire after 3 hours
#
# The web app (Next) is on 127.0.0.1:3100 and the API (Nest) on 127.0.0.1:4100;
# velra.tech's own app keeps 127.0.0.1:3000. Install steps: docs/hosting.md.
#
# `http2 on;` needs nginx >= 1.25.1, as in velra.tech.conf. auth_request is
# built into Debian's nginx (check: nginx -V 2>&1 | grep -o auth_request).
#
# Password guessing is stopped in three layers:
#   1. Here: /api/auth/login takes 5 attempts a minute per address; everything
#      else is held to a rate the app never reaches in normal use.
#   2. The API waits 0.4 s before answering a wrong password.
#   3. fail2ban (deploy/fail2ban/) reads the API's `AUTH-FAIL ip=…` log lines and
#      blocks an address at the firewall after 5 wrong passwords in 10 minutes,
#      for 10 minutes the first time, doubling on every repeat, up to a week.

# Zones must be declared at http level; files in sites-enabled are included
# there, so declaring them here works. 10 MB holds about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=reelstudio:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=reelstudio_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=reelstudio_meta:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name studio.velra.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://studio.velra.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.velra.tech;

    ssl_certificate     /etc/letsencrypt/live/studio.velra.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.velra.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Every location is behind the session check unless it says `auth_request off`.
    auth_request /_auth;

    # A page load fires a burst of API and image requests; 120 covers that
    # without a delay, and anything beyond 10/s sustained gets 429.
    limit_req        zone=reelstudio burst=120 nodelay;
    limit_req_status 429;

    # Product photos, Higgsfield videos and music go up through the API.
    client_max_body_size 1g;

    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag              "noindex, nofollow"                always;

    # ── The session check ────────────────────────────────────────────────────
    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:4100/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /login?next=$uri;
    }

    # ── Open: the sign-in page and its assets ────────────────────────────────
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        auth_request off;
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/auth/ {
        auth_request off;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=reelstudio_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        # The API logs failed attempts with this address, for fail2ban.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Open: Meta calls these ───────────────────────────────────────────────
    location = /api/instagram/webhook {
        auth_request off;
        # Meta delivers in bursts; looser, but still capped.
        limit_req zone=reelstudio_meta burst=200 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/instagram/media/ {
        auth_request off;
        limit_req zone=reelstudio_meta burst=50 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── The API (401 without a session; the web app then goes to /login) ─────
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job progress is a Server-Sent Events stream: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;

        # Uploads stream straight to the API instead of filling nginx's temp dir.
        proxy_request_buffering off;
    }

    # ── The web app (no session: redirect to /login) ─────────────────────────
    location / {
        error_page 401 = @login;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/reel-studio.access.log;
    error_log  /var/log/nginx/reel-studio.error.log;
}
